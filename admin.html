<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scoreboard Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body><div class="wrap">
  <h1 id="title">🎛️ Admin</h1>
  <p class="muted">Tap to change scores — the projector updates instantly. <a id="disp" target="_blank" style="color:var(--accent)">Open scoreboard ↗</a></p>
  <div class="card" id="teams">Loading…</div>
  <div class="err" id="err"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="common.js"></script>
<script>
const id = params.get("game"), key = params.get("key");
const box = document.getElementById("teams"), err = document.getElementById("err");
document.getElementById("disp").href = "display.html?game=" + id;
let game;

function render(g) {
  game = g;
  document.getElementById("title").textContent = "🎛️ " + g.title;
  box.innerHTML = g.teams.map((t, i) => `
    <div class="team">
      <span class="name">${esc(t.name)}</span>
      <button class="sbtn m" data-i="${i}" data-d="-5">−5</button>
      <button class="sbtn m" data-i="${i}" data-d="-1">−1</button>
      <span class="score">${t.score}</span>
      <button class="sbtn p" data-i="${i}" data-d="1">+1</button>
      <button class="sbtn p" data-i="${i}" data-d="5">+5</button>
    </div>`).join("");
}

box.onclick = async (e) => {
  const b = e.target.closest(".sbtn"); if (!b) return;
  const i = +b.dataset.i, d = +b.dataset.d;
  game.teams[i].score += d; render(game); // optimistic
  const { error } = await db.rpc("trivia_add_score", { p_id: id, p_key: key, p_idx: i, p_delta: d });
  err.textContent = error ? "Failed to save: " + error.message : "";
  if (error) fetchGame(id).then(render);
};

fetchGame(id).then((g) => { render(g); watchGame(id, render); })
  .catch(() => (box.textContent = "Game not found — check your admin link."));
</script></body></html>
